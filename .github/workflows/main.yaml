name: Metrics

on:
  # once per day
  schedule: [{cron: "0 6 * * *"}]
  push: {branches: ["main"]}
  workflow_dispatch:

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    environment:
      name: production
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6 # v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN }}

          user: eldios
          committer_branch: metrics
          template: classic
          base: header, activity, community, repositories #, metadata
          config_animations: yes
          config_timezone: Europe/Rome
          optimize: yes
          #repositories_forks: yes
          use_prebuilt_image: yes

          # achievements queries the deprecated Projects classic API and fails
          # (upstream lowlighter/metrics#1706, fix PR #1769 unmerged)
          plugin_achievements: no
          plugin_achievements_display: compact
          plugin_achievements_ignored: explorer, infographile, member, worker, verified
          plugin_achievements_secrets: yes
          plugin_achievements_threshold: B
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          plugin_languages: yes
          plugin_languages_details: percentage
          #plugin_languages_skipped: GOD-GOG
          plugin_lines: yes
          #plugin_notable: yes
          #plugin_notable_filter: stars:>100
          #plugin_notable_repositories: yes
          plugin_repositories: yes
          plugin_repositories_featured: nixos/nixpkgs, eldios/dotfiles
          plugin_topics: yes
          #plugin_topics_mode: mastered
          #plugin_topics_limit: 20
          plugin_traffic: yes
